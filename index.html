<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleeping Beauty — St. Symphorosa School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@600;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      font-family: sans-serif;
    }

    /* ── Shared panel ── */
    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 2rem;
      text-decoration: none;
      min-height: 100vh;
      transition: filter 0.2s;
      overflow: hidden;
    }

    .panel:hover { filter: brightness(1.08); }

    .panel-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      opacity: 0.7;
    }

    .panel-title {
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .panel-date {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      opacity: 0.6;
      margin-bottom: 2.5rem;
    }

    .panel-divider {
      width: 40px;
      height: 2px;
      margin: 0 auto 2rem;
      opacity: 0.4;
    }

    .panel-label {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 0.4rem;
    }

    .panel-experience {
      margin-bottom: 2.5rem;
      line-height: 1.15;
    }

    .panel-cta {
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 0.65rem 2rem;
      border-radius: 4px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .panel:hover .panel-cta {
      transform: translateY(-2px);
    }

    /* ── Enchanted ── */
    .panel-enchanted {
      background: radial-gradient(ellipse at 50% 20%, #1c1060 0%, #08081f 70%);
      color: #f5ead8;
      border-right: 1px solid rgba(201,168,76,0.2);
    }

    .panel-enchanted::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 20%, rgba(201,168,76,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 80% 15%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 70%, rgba(201,168,76,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 25% 85%, rgba(201,168,76,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 10%, rgba(201,168,76,0.45) 0%, transparent 100%);
      pointer-events: none;
    }

    .panel-enchanted .panel-eyebrow { color: #c9a84c; opacity: 1; }

    .panel-enchanted .panel-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.8rem, 5vw, 4.5rem);
      font-weight: 900;
      color: #f5ead8;
      text-shadow: 0 0 60px rgba(201,168,76,0.4);
    }

    .panel-enchanted .panel-date { color: #c9a84c; }
    .panel-enchanted .panel-divider { background: #c9a84c; }
    .panel-enchanted .panel-experience {
      font-family: 'Cinzel', serif;
      font-size: clamp(1rem, 2vw, 1.4rem);
      font-weight: 600;
      color: #f5ead8;
    }

    .panel-enchanted .panel-cta {
      border: 1px solid #c9a84c;
      color: #c9a84c;
      background: transparent;
      font-family: 'Cinzel', serif;
    }

    .panel-enchanted:hover .panel-cta {
      background: #c9a84c;
      color: #08081f;
      box-shadow: 0 4px 20px rgba(201,168,76,0.3);
    }

    /* ── Spirit ── */
    .panel-spirit {
      background: #1a3a8f;
      color: white;
    }

    .panel-spirit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -55deg,
        transparent,
        transparent 28px,
        rgba(255,255,255,0.03) 28px,
        rgba(255,255,255,0.03) 30px
      );
      pointer-events: none;
    }

    .panel-spirit .panel-eyebrow { color: #f5c400; opacity: 1; }

    .panel-spirit .panel-title {
      font-family: 'Bangers', cursive;
      font-size: clamp(3.5rem, 6vw, 5.5rem);
      letter-spacing: 0.04em;
      color: white;
      text-shadow: 3px 3px 0 #f5c400, 5px 5px 0 #d4a800;
    }

    .panel-spirit .panel-date { color: #f5c400; }
    .panel-spirit .panel-divider { background: #f5c400; }
    .panel-spirit .panel-experience {
      font-family: 'Bangers', cursive;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      letter-spacing: 0.06em;
      color: #f5c400;
    }

    .panel-spirit .panel-cta {
      background: #f5c400;
      color: #1a3a8f;
      font-family: 'Bangers', cursive;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      border: none;
      box-shadow: 3px 3px 0 #d4a800;
    }

    .panel-spirit:hover .panel-cta {
      box-shadow: 5px 5px 0 #d4a800;
    }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .panel {
        min-height: 50vh;
        padding: 2.5rem 1.5rem;
      }

      .panel-enchanted { border-right: none; border-bottom: 1px solid rgba(201,168,76,0.2); }
    }
  </style>
</head>
<body>

  <a class="panel panel-enchanted" href="enchanted.html">
    <p class="panel-eyebrow">St. Symphorosa School &mdash; May 15, 2026</p>
    <h1 class="panel-title">Sleeping<br>Beauty</h1>
    <p class="panel-date">Presented with Missoula Children's Theatre</p>
    <div class="panel-divider"></div>
    <p class="panel-label">Experience</p>
    <p class="panel-experience">The Enchanted<br>Version</p>
    <span class="panel-cta">Enter &rarr;</span>
  </a>

  <a class="panel panel-spirit" href="spirit.html">
    <p class="panel-eyebrow">St. Symphorosa School &mdash; May 15, 2026</p>
    <h1 class="panel-title">Sleeping<br>Beauty</h1>
    <p class="panel-date">Presented with Missoula Children's Theatre</p>
    <div class="panel-divider"></div>
    <p class="panel-label">Experience</p>
    <p class="panel-experience">School Spirit<br>Edition</p>
    <span class="panel-cta">Let's Go! &rarr;</span>
  </a>

</body>
</html>
